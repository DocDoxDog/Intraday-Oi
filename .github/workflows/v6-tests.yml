name: v6-market-intelligence-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v6-market-intelligence]

jobs:
  v6-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile V6 modules
        run: python -m py_compile src/regime_fingerprint.py src/episodic_memory.py src/research_gate.py src/v6_intelligence.py src/main.py src/supabot_llm.py
      - name: Pytest fingerprint
        run: pytest -q tests/test_v6_intelligence.py::test_regime_fingerprint_is_deterministic
      - name: Pytest future
        run: pytest -q tests/test_v6_intelligence.py::test_future_episode_is_rejected
      - name: Pytest outcome
        run: pytest -q tests/test_v6_intelligence.py::test_past_episode_hides_outcome
      - name: Pytest purge
        run: pytest -q tests/test_v6_intelligence.py::test_purged_embargoed_split
      - name: Pytest cost
        run: pytest -q tests/test_v6_intelligence.py::test_cost_gate
      - name: Pytest promotion
        run: pytest -q tests/test_v6_intelligence.py::test_promotion_never_authorizes_production
      - name: Pytest bundle
        run: pytest -q tests/test_v6_intelligence.py::test_v6_bundle_contains_governance

  v6-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
