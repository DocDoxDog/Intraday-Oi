name: free-news-feed-tests

on:
  pull_request:
    paths:
      - "intelligence/news/**"
      - "tests/test_free_news_providers.py"
      - ".github/workflows/free-news-feed-tests.yml"
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run free news provider tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_free_news_providers.py
      - name: Compile news package
        run: python -m compileall -q intelligence/news
