name: QuikStrike Scrape Smoke

on:
  push:
    branches: [main]
    paths:
      - "src/scraper.py"
      - "src/url_manager.py"
      - ".github/workflows/quikstrike-scrape-smoke.yml"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Live QuikStrike scrape only
        env:
          QUIKSTRIKE_URL: ${{ secrets.QUIKSTRIKE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          export PYTHONUNBUFFERED=1
          timeout 120s python - <<'PY'
          import json
          from src.url_manager import UrlManager
          from src.scraper import scrape_multi_expiration

          url = UrlManager().get_url()

          # Diagnostic only: discover the current CME expiration control shape
          # before the canonical scraper runs.
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-dev-shm-usage"])
              page = browser.new_page(
                  viewport={"width": 1600, "height": 1000},
                  extra_http_headers={"Referer": "https://www.cmegroup.com/tools-information/quikstrike/vol2vol-expected-range.html"},
              )
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(2000)
              print("\n=== EXPIRATION DOM DIAGNOSTIC ===")
              elems = page.locator("a,button,[role='button'],[role='option'],[role='menuitem'],[role='combobox'],[aria-haspopup]")
              for i in range(min(elems.count(), 500)):
                  el = elems.nth(i)
                  try:
                      txt = " ".join((el.inner_text() or "").split())
                      attrs = el.evaluate("(e) => ({id:e.id, cls:e.className, aria:e.getAttribute('aria-label'), title:e.getAttribute('title'), role:e.getAttribute('role')})")
                  except Exception:
                      continue
                  if txt and ("EXPIRATION" in txt.upper() or "OG1V6" in txt.upper() or "DTE" in txt.upper()):
                      print({"text": txt[:300], **attrs})
              trigger = page.locator("#ctl00_ucSelector_hlExpiration")
              if trigger.count():
                  print("\n=== EXPIRATION TRIGGER HTML ===")
                  print(trigger.first.evaluate("(e) => e.parentElement ? e.parentElement.outerHTML.slice(0,12000) : e.outerHTML.slice(0,12000)"))
              print("\n=== ARROW / NAV ELEMENTS ===")
              navs = page.locator("a,button,[role='button'],[aria-label],[title]")
              for i in range(min(navs.count(), 500)):
                  el = navs.nth(i)
                  try:
                      attrs = el.evaluate("(e) => ({text:(e.innerText||'').trim(),id:e.id,aria:e.getAttribute('aria-label'),title:e.getAttribute('title'),cls:e.className})")
                  except Exception:
                      continue
                  blob = " ".join(str(v or "") for v in attrs.values()).upper()
                  if any(x in blob for x in ["NEXT", "PREVIOUS", "EXPIRATION", "›", "»", "→"]):
                      print({k:str(v)[:500] for k,v in attrs.items()})
              browser.close()

          raw = scrape_multi_expiration(url, limit=7)
          snaps = raw.get("expiration_snapshots") or []
          print(json.dumps({
              "ok": True,
              "count": len(snaps),
              "expirations": [
                  {
                      "code": (s.get("expiration_selection") or {}).get("selected"),
                      "dte": (s.get("expiration_selection") or {}).get("dte_hint"),
                      "heading": s.get("page_heading"),
                      "strike_rows": len((s.get("chart_data") or {}).get("strike_rows") or []),
                      "has_source_screenshot": bool(s.get("source_screenshot")),
                  }
                  for s in snaps
              ],
          }, ensure_ascii=False, indent=2))
          PY
