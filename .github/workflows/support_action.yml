name: ☕ Support Request

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ทดสอบก่อนส่งจริง (true/false)"
        required: true
        default: "false"

jobs:
  support:
    runs-on: ubuntu-latest

    steps:
      - name: Send support message via LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["LINE_CHANNEL_ACCESS_TOKEN"]
          dry_run = os.environ["DRY_RUN"].lower() == "true"

          message = (
              "☕ สนับสนุนค่ากาแฟ\n\n"
              "หากเห็นว่า OI BOT มีประโยชน์ และต้องการสนับสนุน\n"
              "ค่ากาแฟหรือค่าเซิร์ฟเวอร์ สามารถสนับสนุนได้ตามสะดวกครับ 🙏\n\n"
              "🏦 ธนาคารกสิกรไทย\n"
              "เลขบัญชี: 1641750162\n"
              "ชื่อบัญชี: นายสุภเดช บุญยะราช\n\n"
              "ขอบคุณสำหรับทุกการสนับสนุนครับ ❤️"
          )

          print("🎯 ส่งแบบ LINE Broadcast — หาทุกคนที่แอดเพื่อน LINE OA")

          if dry_run:
              print("🧪 DRY RUN — ยังไม่ได้ส่งข้อความ")
              print("----- ตัวอย่างข้อความ -----")
              print(message)
              raise SystemExit(0)

          resp = requests.post(
              "https://api.line.me/v2/bot/message/broadcast",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              json={"messages": [{"type": "text", "text": message[:5000]}]},
              timeout=20,
          )

          if resp.ok:
              print("✅ ส่ง LINE broadcast สำเร็จ")
          else:
              print(f"❌ ส่ง LINE broadcast ล้มเหลว [{resp.status_code}]: {resp.text}")
              raise SystemExit(1)
          PY
