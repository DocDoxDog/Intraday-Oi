name: Flow Intelligence Tests

on:
  push:
    branches:
      - main
      - feat/decision-engine-flow-architecture-v1
  pull_request:

jobs:
  flow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run flow regression tests
        run: PYTHONPATH=. pytest -q tests/test_event_outcome_engine.py tests/test_flow_llm_contract.py
