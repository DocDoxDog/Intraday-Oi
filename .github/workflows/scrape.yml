name: Scrape OI Intraday

on:
  schedule:
    # ปรับตามช่วง session ที่สนใจ (UTC) — ตอนนี้ตั้ง 4 ครั้ง/วันคร่าวๆ
    # 08:00, 13:00 (London open), 18:00 (NY open), 22:00 UTC (EOD-ish)
    - cron: "0 8,13,18,22 * * *"
  workflow_dispatch: {}   # กดรันเองได้จาก GitHub UI ด้วย

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run pipeline
        env:
          QUIKSTRIKE_URL: ${{ secrets.QUIKSTRIKE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py
