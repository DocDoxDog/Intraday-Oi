name: Scrape OI Intraday

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-analysis]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned supaBOT gateway
        uses: actions/checkout@v4
        with:
          repository: DocDoxDog/supaBOT
          ref: 354a7299e6faa512495e2aec848318365692fb76
          path: ../supaBOT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Intraday-Oi dependencies
        run: |
          python -m pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start pinned local supaBOT gateway
        working-directory: ../supaBOT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_LLM_GATEWAY_ENABLED: "true"
          INTERNAL_LLM_GATEWAY_TOKEN: "local-ci-gateway-token"
        run: |
          cat > /tmp/start_supabot.py <<'PY'
          import src.llm_telemetry as t
          t.persist_llm_run = lambda *args, **kwargs: None
          t.persist_llm_verification = lambda *args, **kwargs: None
          import uvicorn
          uvicorn.run("src.api:create_app", factory=True, host="127.0.0.1", port=8787)
          PY
          python /tmp/start_supabot.py > /tmp/supabot.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              echo "supaBOT gateway ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/supabot.log
          exit 1

      - name: Run live pipeline with existing GitHub secrets
        env:
          QUIKSTRIKE_URL: ${{ secrets.QUIKSTRIKE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABOT_LLM_GATEWAY_URL: http://127.0.0.1:8787
          SUPABOT_LLM_GATEWAY_TOKEN: "local-ci-gateway-token"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_SYMBOL: XAU/USD
          SUPABOT_LLM_TIMEOUT_SECONDS: "60"
        run: python src/main.py
