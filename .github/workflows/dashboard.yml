name: Dashboard Build

on:
  pull_request:
    paths:
      - "dashboard/**"
  push:
    branches:
      - main
    paths:
      - "dashboard/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
