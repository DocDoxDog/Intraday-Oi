name: oi-intelligence-tests
on:
  push:
    paths:
      - 'src/gex.py'
      - 'src/oi_intelligence.py'
      - 'src/parser.py'
      - 'src/oi_positioning.py'
      - 'tests/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_oi_intelligence.py tests/test_gex.py
