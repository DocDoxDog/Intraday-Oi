name: oi-intelligence-tests

on:
  push:
    paths:
      - 'src/gex.py'
      - 'src/oi_intelligence.py'
      - 'src/parser.py'
      - 'src/oi_positioning.py'
      - 'src/contracts.py'
      - 'quant/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Clone Ai-trader legacy GEX for parity
        run: git clone --depth 1 https://github.com/DocDoxDog/Ai-trader.git "$RUNNER_TEMP/Ai-trader"

      - name: Run canonical quant tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          AI_TRADER_GEX_PATH: ${{ runner.temp }}/Ai-trader/ai_gold/data/options/gex.py
        run: |
          python -m pytest -q \
            tests/test_contracts.py \
            tests/test_canonical_contracts.py \
            tests/test_gex.py \
            tests/test_canonical_gex.py \
            tests/test_gex_parity.py \
            tests/test_oi_intelligence.py \
            tests/test_oi_pit.py \
            tests/test_black76.py \
            tests/test_dex.py \
            tests/test_market_state.py
