name: oi-intelligence-tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/oi-intelligence-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m compileall -q src
      - run: python -m pytest -q tests/test_oi_intelligence.py tests/test_gex.py tests/test_supabot_llm.py tests/test_telegram_analyst.py tests/test_parser_expected_ranges.py tests/test_package_imports.py
