name: PR Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile
        run: python -m compileall -q src

      - name: Telegram and parser regression tests
        run: |
          python -m pytest -q \
            tests/test_supabot_llm.py \
            tests/test_telegram_analyst.py \
            tests/test_parser_expected_ranges.py
