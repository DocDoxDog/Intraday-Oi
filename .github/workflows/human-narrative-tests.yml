name: human-narrative-tests

on:
  push:
    branches: [v6-human-narrative]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile narrative modules
        run: |
          python -m py_compile src/customer_narrative.py src/main.py src/telegram.py src/supabot_llm.py
      - name: Run narrative tests
        run: pytest -q tests/test_customer_narrative.py
