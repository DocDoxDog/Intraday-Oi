name: web-build
on:
  push:
    paths: ["web/**",".github/workflows/web-build.yml"]
  pull_request:
    paths: ["web/**",".github/workflows/web-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run build
