name: phase6-commercial-gates

on:
  push:
    paths:
      - "commercial/**"
      - "tests/test_phase6_*.py"
      - ".github/workflows/phase6-commercial-gates.yml"
  pull_request:
    paths:
      - "commercial/**"
      - "tests/test_phase6_*.py"
      - ".github/workflows/phase6-commercial-gates.yml"
  workflow_dispatch:

jobs:
  phase6-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run Phase 6 tests
        run: |
          python -m pytest -q             tests/test_phase6_release_gate.py             tests/test_phase6_market_state.py             tests/test_phase6_source_rights.py
      - name: Compile Phase 6 Python
        run: |
          python -m compileall -q commercial             tests/test_phase6_release_gate.py             tests/test_phase6_market_state.py             tests/test_phase6_source_rights.py
